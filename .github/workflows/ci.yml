name: A2-RAG CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  runtime-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies exactly as users do
        run: python -m pip install --require-hashes -r requirements-runtime.lock.txt
      - name: Check runtime dependency consistency
        run: python scripts/verify_environment.py --allow-system --verify-lock requirements-runtime.lock.txt
      - name: Smoke-test runtime imports and dataset fixture
        run: python -c "from data import load_documents; from evaluation.benchmark_contract import load_expected_abstention_indexes; assert load_documents(limit=1); assert load_expected_abstention_indexes() == frozenset()"

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Check dependency consistency
        run: python scripts/verify_environment.py --allow-system --verify-lock requirements.lock.txt
      - name: Verify runtime lock
        run: python scripts/verify_environment.py --allow-system --verify-lock requirements-runtime.lock.txt
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock.txt --disable-pip --strict
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          python -m pip_audit -r requirements.lock.txt --disable-pip --strict --format cyclonedx-json --output dist/sbom.cdx.json
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run lint
        run: ruff check .
      - name: Run tests
        env:
          A2_RAG_OFFLINE: '1'
          A2_RAG_TEST_EMBEDDINGS: '1'
        run: pytest -q
      - name: Run project audit
        run: python scripts/audit_project.py
      - name: Build canonical release artifacts
        if: matrix.python-version == '3.12'
        run: |
          python scripts/clean_artifacts.py
          A2_RAG_STRICT_PACKAGE_AUDIT=1 python scripts/audit_project.py
          python scripts/clean_artifacts.py
          python scripts/build_release.py
      - name: Retain release artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a2-rag-release
          path: |
            dist/a2-rag-release.zip
            dist/a2-rag-release.zip.sha256
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
